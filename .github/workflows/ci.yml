name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Placeholder values — the app never actually talks to Supabase during
# typecheck/test/build (service client + env validation are lazy, called
# only when a route/action runs), so these just need to be well-formed.
# To run this workflow against the real project instead, add repo secrets
# (Settings → Secrets and variables → Actions) named NEXT_PUBLIC_SUPABASE_URL,
# NEXT_PUBLIC_SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY, LMS_SESSION_SECRET
# and reference them here as ${{ secrets.NAME }}.
env:
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
  SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
  LMS_SESSION_SECRET: placeholder-session-secret-for-ci-only

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

      - name: Lint
        run: npx eslint .

      - name: Build
        run: npm run build
